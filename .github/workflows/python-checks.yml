name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: python -m pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Brain checks
        run: python tests/test_brain.py
      - name: PPO checks
        run: python tests/test_ppo.py
      - name: Simulator integration
        run: python tests/test_sim_session.py 120
